name: Scrape prices & deploy site

on:
  schedule:
    - cron: "20 */6 * * *"      # every 6 hours (UTC) - roughly 6am/12pm/6pm/12am Nepal time
  workflow_dispatch:            # "Run workflow" button
  push:
    branches: [main]
    paths: ["web/**"]           # redeploy when you edit the site

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: scrape-and-deploy
  cancel-in-progress: false

jobs:
  scrape:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Scrape stores
        id: scrape
        continue-on-error: true      # a broken store must not stop the commit, health check or deploy
        env:
          WEBSHARE_MODE: ${{ vars.WEBSHARE_MODE || 'rotating' }}
          WEBSHARE_PROXY_USERNAME: ${{ secrets.WEBSHARE_PROXY_USERNAME }}
          WEBSHARE_PROXY_PASSWORD: ${{ secrets.WEBSHARE_PROXY_PASSWORD }}
          WEBSHARE_API_KEY: ${{ secrets.WEBSHARE_API_KEY }}
          WEBSHARE_COUNTRIES: ${{ vars.WEBSHARE_COUNTRIES }}
          SITE_URL: ${{ vars.SITE_URL }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
          CF_ANALYTICS_TOKEN: ${{ vars.CF_ANALYTICS_TOKEN }}
          ALERTS_URL: ${{ vars.ALERTS_URL }}
          ALERTS_TOKEN: ${{ secrets.ALERTS_TOKEN }}
          STATUS_KEY: ${{ secrets.STATUS_KEY }}
        run: python -m scraper run

      - name: Health check (emails you when a store breaks)
        id: health
        if: always()
        continue-on-error: true
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
          SITE_URL: ${{ vars.SITE_URL }}
          STATUS_KEY: ${{ secrets.STATUS_KEY }}
        run: python -m scraper health --notify

      - name: Commit new prices
        if: always()
        run: |
          git config user.name  "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add data/prices.db web   # prices, health notices, model pages, status page, sitemap.xml, robots.txt
          git diff --cached --quiet || git commit -m "data: prices $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push

      - name: Mark run as failed if something broke
        if: always() && (steps.scrape.outcome == 'failure' || steps.health.outcome == 'failure')
        run: |
          echo "::warning::A store or the health check reported a problem - see the summary above."
          exit 1

  # Hosting: Cloudflare Pages by default. Set the repository variable HOSTING=github to use GitHub Pages instead.
  deploy:
    name: Publish to Cloudflare Pages
    needs: scrape
    if: always() && needs.scrape.result != 'cancelled' && vars.HOSTING != 'github'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main               # pick up the data commit made by the scrape job
      - name: Check Cloudflare settings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets (run python scripts/deploy.py), or set the variable HOSTING=github."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Upload web/ to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >
          npx --yes wrangler@4 pages deploy web
          --project-name "${{ vars.CF_PAGES_PROJECT || 'bhaau' }}"
          --branch main --commit-dirty=true

  deploy-github-pages:
    name: Publish to GitHub Pages
    needs: scrape
    if: always() && needs.scrape.result != 'cancelled' && vars.HOSTING == 'github'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
